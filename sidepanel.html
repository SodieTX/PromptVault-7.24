  .phv img{width:auto;height:auto;max-width:100%;max-height:52vh;border-radius:6px;display:block;margin:0 auto;background:var(--inp);object-fit:contain}
  .phv-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:30px;height:38px;border:1px solid rgba(255,255,255,.22);border-radius:6px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:18px}
  .phv-nav:hover{background:rgba(0,0,0,.78)}
  .phv-prev{left:5px}.phv-next{right:5px}
  .phv-t{font-size:11px;font-weight:600;margin-top:8px;word-break:break-word}
  .phv-m{font-size:9px;color:var(--dm);margin-top:2px}
  .phv-count{font-size:9px;color:var(--dm);margin-left:auto}
  .ph-report-note{font-size:9px;color:var(--mu);line-height:1.5;padding:7px;border:1px solid var(--bl);border-radius:5px;background:var(--sf);margin-top:7px}
  .primary-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 8px;border-bottom:1px solid var(--bl);background:color-mix(in srgb,var(--bg) 94%,var(--sf))}.primary-action{border:1px solid transparent;background:transparent;color:var(--mu);border-radius:6px;padding:6px 4px;font-size:10px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}.primary-action:hover{background:var(--hv);color:var(--tx)}.primary-action.active{background:color-mix(in srgb,var(--ac) 10%,transparent);border-color:color-mix(in srgb,var(--ac) 25%,transparent);color:var(--ac)}.hdr-r .ib{opacity:.62}.hdr-r .ib:hover{opacity:1}.tabs{background:color-mix(in srgb,var(--sf) 72%,var(--bg))}.tab{opacity:.76}.tab[class*="t-"]{opacity:1}.trust-onboard .trust-kicker{font-size:8px;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.8px}.trust-onboard h3{font-size:17px;margin:3px 0}.trust-onboard>p{font-size:10px;color:var(--mu);line-height:1.5}.trust-choice{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bl)}.trust-choice>div{display:flex;flex-direction:column;gap:2px}.trust-choice strong{font-size:10px}.trust-choice small{font-size:8px;color:var(--dm);line-height:1.4}.trust-note{font-size:9px;color:var(--mu);line-height:1.5;background:var(--inp);border-radius:6px;padding:7px;margin-top:8px}
  .prov-stamp{display:flex;align-items:center;gap:4px;font-size:8px;color:var(--dm);margin-top:4px}.prov-stamp strong{font-weight:500;color:var(--mu)}.prov-stamp span+span:before,.prov-stamp strong+span:before{content:"·";margin-right:4px;color:var(--dm)}
  .recovery-center{padding:14px;max-width:820px;margin:0 auto}.rc-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:12px}.rc-head h2{font-size:18px;margin:0 0 3px}.rc-head p,.rc-card p{font-size:10px;color:var(--mu);line-height:1.5;margin:0}.rc-health{font-size:9px;color:var(--dm);border:1px solid var(--bl);border-radius:999px;padding:4px 8px;white-space:nowrap}.rc-health.ok{color:var(--gn);border-color:color-mix(in srgb,var(--gn) 35%,var(--bl))}.rc-health.warn{color:var(--ac)}.rc-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:9px}.rc-stat{background:var(--sf);border:1px solid var(--bl);border-radius:7px;padding:8px;display:flex;flex-direction:column;gap:2px}.rc-stat span,.rc-stat small{font-size:8px;color:var(--dm)}.rc-stat strong{font-size:13px}.rc-card{background:var(--sf);border:1px solid var(--bl);border-radius:9px;padding:11px;margin-bottom:8px}.rc-card.rc-primary{border-color:color-mix(in srgb,var(--ac) 38%,var(--bl));background:color-mix(in srgb,var(--ac) 4%,var(--sf))}.rc-card-title{font-size:12px;font-weight:600;margin-bottom:4px}.rc-badge{font-size:7px;text-transform:uppercase;letter-spacing:.5px;color:var(--ac);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:999px;padding:2px 5px;margin-left:4px}.rc-detail{font-size:9px;color:var(--dm);margin-top:7px}.rc-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rc-snap{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bl)}.rc-snap:last-child{border-bottom:0}.rc-snap div{display:flex;flex-direction:column;gap:2px}.rc-snap strong{font-size:9px}.rc-snap span,.rc-empty{font-size:8px;color:var(--dm)}.rc-coverage{display:grid;grid-template-columns:1fr 1fr;gap:7px}.rc-coverage>div{display:grid;grid-template-columns:8px 1fr;column-gap:5px;align-items:center}.rc-coverage strong{font-size:9px}.rc-coverage small{grid-column:2;font-size:8px;color:var(--dm)}.rc-dot{width:7px;height:7px;border-radius:50%;background:var(--dm)}.rc-dot.ok{background:var(--gn)}.rc-dot.warn{background:var(--ac)}.rc-dot.info{background:var(--sn)}.rc-diff{border:1px solid var(--bl);border-radius:6px;overflow:hidden;margin:7px 0}.rc-diff-row{display:grid;grid-template-columns:1.5fr repeat(3,.65fr);gap:4px;padding:4px 6px;font-size:9px;border-bottom:1px solid var(--bl)}.rc-diff-row:last-child{border:0}.rc-diff-h{background:var(--inp);color:var(--dm);font-weight:600}@media(max-width:460px){.rc-grid{grid-template-columns:1fr}.rc-coverage{grid-template-columns:1fr}.rc-head{flex-direction:column}}

  /* ═══════ UX SCALE PASS (v7.12) ═══════
     One block, appended last so the cascade wins. Raises the whole UI from
     microfiche scale to readable scale: minimum ~24px hit targets, minimum
     ~9.5px type, visible button affordances, keyboard focus rings.
     Density philosophy unchanged — everything just stops being squint-sized. */
  body{font-size:13px}
  ::-webkit-scrollbar{width:8px}
  :focus-visible{outline:2px solid color-mix(in srgb,var(--tab-ac,var(--ac)) 70%,transparent);outline-offset:1px;border-radius:4px}

  /* Icon buttons: 16×16 → 26×26 hit targets, faint border so they read as buttons */
  .ib{padding:5px;border-radius:5px;min-width:26px;min-height:26px;align-items:center;justify-content:center}
  .hdr{padding:7px 12px}
  .hdr-r{gap:3px}
  .hdr-r .ib{opacity:.85}
  .hdr-t{font-size:13px}

  /* Primary nav: stop looking disabled */
  .primary-action{font-size:11.5px;padding:8px 6px;border-color:var(--bl);background:color-mix(in srgb,var(--sf) 60%,transparent);color:var(--tx)}
  .primary-action:hover{border-color:var(--bd)}

  /* Tabs: labels readable, counts readable */
  .tab{padding:6px 2px 5px;font-size:11px}
  .tab-label{font-size:9px}
  .tab .ct{font-size:8.5px;line-height:13px;min-width:13px}

  /* Search */
  .srch-box{padding:5px 8px;border-radius:6px}
  .srch-box input{font-size:12px}

  /* Small + action buttons */
  .bs{font-size:11px;padding:5px 8px;border-radius:5px;min-height:26px}
  .ba{font-size:12px;padding:7px;min-height:30px}
  .inj-btn{font-size:11px;padding:4px 10px;border-radius:5px}
  .qb-chip{font-size:11px;padding:4px 10px}
  .sort-o{font-size:11px;padding:6px 10px}

  /* Cards: title/preview/meta/tags all one notch up */
  .pc{padding:8px 10px;margin-bottom:4px}
  .pc .ttext{font-size:12.5px}
  .pc .prev{font-size:11px}
  .pc .meta{font-size:9.5px;margin-top:4px}
  .pc .src{font-size:9.5px}
  .pc .tag{font-size:9.5px;line-height:18px;padding:0 6px;border-radius:6px}
  .pc .acts{gap:2px;margin-left:4px}

  /* Folder chips + breadcrumbs */
  .sf-chip{font-size:11px;padding:5px 9px}
  .bc{font-size:11px;gap:4px;margin-bottom:6px}
  .coll-dot{width:8px;height:8px}
  .empty-hint{font-size:10px}

  /* In-app context menu: touchable rows */
  .ctx{min-width:190px;padding:4px;border-radius:8px}
  .ctx-i{padding:7px 10px;font-size:12px;gap:7px;border-radius:5px}
  .ctx-s{margin:3px 7px}

  /* ⋯ overflow — the discoverable door to every item action */
  .more-btn{color:var(--mu)}
  .more-btn:hover{color:var(--tx);background:var(--hv)}
  .ctx-i.ctx-hint{color:var(--dm);font-size:10.5px;cursor:default}
  .ctx-i.ctx-hint:hover{background:transparent}
  .tile-more{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.45);color:#fff;opacity:0;min-width:24px;min-height:24px;padding:3px;border-radius:5px;backdrop-filter:blur(2px)}
  .lt:hover .tile-more,.pht:hover .tile-more,.tile-more:focus-visible{opacity:1}
  .tile-more:hover{background:rgba(0,0,0,.7);color:#fff}
  /* Prompt chains */
  .ch-hd{display:flex;align-items:center;gap:6px;padding:6px 2px 8px;border-bottom:1px solid var(--bl);margin-bottom:8px;flex-wrap:wrap}
  .ch-ttl{font-size:12px;font-weight:700;color:var(--ac)}
  .ch-badge{font-size:8px;background:var(--ad);color:var(--ac);border-radius:8px;padding:0 5px;font-weight:700}
  .ch-badge-err{background:var(--dd);color:var(--dn)}
  .ch-list,.ch-steps{display:flex;flex-direction:column;gap:4px}
  .ch-row,.ch-step{display:flex;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--bl);border-radius:7px;background:var(--sf);cursor:pointer}
  .ch-row:hover,.ch-step:hover{background:var(--hv)}
  .ch-name{font-size:11px;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-sub{font-size:9px;color:var(--dm);margin-top:2px;display:flex;gap:6px;align-items:center}
  .ch-pfx{font-family:'Courier New',monospace;background:var(--inp);color:var(--ac);padding:0 4px;border-radius:3px;font-size:10px}
  .ch-num{width:20px;height:20px;flex-shrink:0;border-radius:50%;background:var(--ad);color:var(--ac);font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .ch-btns{display:flex;gap:1px;flex-shrink:0}
  .ch-warn{font-size:8px;color:var(--ac);background:var(--ad);padding:0 5px;border-radius:3px}
  .ch-warn-err{color:var(--dn);background:var(--dd)}
  .ch-gap{font-size:9px;color:var(--ac);background:var(--ad);border-radius:5px;padding:3px 8px;text-align:center}
  .ch-acts{display:flex;gap:5px;align-items:center;margin-bottom:8px}
  .ed-chain-row{display:flex;align-items:center;gap:5px;flex-wrap:wrap;font-size:9px;margin-top:4px}
  .ed-chain-chip{background:var(--ad);color:var(--ac);border-radius:4px;padding:1px 6px;font-size:8.5px}
  /* Claude Commands library */
  .cc-wrap{display:flex;flex-direction:column}
  .cc-sub{font-size:9px;color:var(--dm)}
  .cc-chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .cc-chip{font-size:9px;padding:2px 7px;border-radius:11px;border:1px solid var(--bl);background:var(--sf);color:var(--mu);cursor:pointer;white-space:nowrap}
  .cc-chip:hover{background:var(--hv);color:var(--tx)}
  .cc-chip-a{background:var(--skd);border-color:var(--sk);color:var(--sk)}
  .cc-n{opacity:.6;font-size:8px}
  .cc-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
  .cc-row{display:flex;gap:6px;align-items:flex-start;padding:5px 6px;border:1px solid var(--bl);border-radius:6px;background:var(--sf);cursor:pointer}
  .cc-row:hover{background:var(--hv)}
  .cc-main{flex:1;min-width:0}
  .cc-name{font-size:11px;color:var(--tx);display:flex;align-items:center;gap:5px}
  .cc-name code{font-family:'Courier New',monospace;background:var(--inp);padding:0 4px;border-radius:3px;color:var(--sk)}
  .cc-desc{font-size:9.5px;color:var(--mu);line-height:1.35;margin-top:2px}
  .cc-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;align-items:center}
  .cc-tag{font-size:8px;background:var(--inp);color:var(--dm);padding:0 5px;border-radius:3px}
  .cc-ex{font-size:8px;color:var(--ac)}
  .cc-acts{display:flex;flex-direction:column;gap:3px;flex-shrink:0}
  .cc-use{white-space:nowrap}
  .cc-more,.cc-empty{font-size:9px;color:var(--dm);text-align:center;padding:8px}
  /* Claude Commands — inline tab panel (aTab==="claudecmds") */
  .cc-panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .cc-panel-hd{padding:9px 11px 7px;border-bottom:1px solid var(--bl);flex-shrink:0;background:color-mix(in srgb,var(--sf) 55%,var(--bg))}
  .cc-panel-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:3px}
  .cc-panel-ttl{font-size:13px;font-weight:700;color:var(--cc);display:flex;align-items:center;gap:5px}
  .cc-panel-acts{display:flex;gap:5px;align-items:center;flex-shrink:0}
  .cc-panel-hd input#ccSearch{width:100%;margin:2px 0 6px}
  .cc-scroll{flex:1;min-height:0;overflow-y:auto;padding:9px 11px}
  .cc-list-panel{max-height:none}
  .cc-panel .cc-chip-a{background:var(--ccd);border-color:var(--cc);color:var(--cc)}
  .cc-tree{border:1px solid var(--bl);border-radius:6px;padding:4px;margin-bottom:6px;background:var(--inp)}
  .cc-tree-row{display:flex;align-items:center;gap:5px;padding:3px 5px;border-radius:4px;cursor:pointer;color:var(--mu);font-size:9px}
  .cc-tree-row:hover{background:var(--hv);color:var(--tx)}
  .cc-tree-row.active{background:var(--ccd);color:var(--cc)}
  .cc-tree-kind{font-size:8px;opacity:.7}.cc-tree-count{margin-left:auto;font-size:8px;opacity:.65}
  .cc-playlist-acts{display:flex;gap:4px;margin:0 0 6px}
  .cc-panel .cc-name code{color:var(--cc)}
  .cc-grp{font-size:7.5px;color:var(--dm);background:var(--inp);padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:600}
  .cc-exrow{font-size:9px;color:var(--mu);margin-top:3px;line-height:1.4;overflow-wrap:anywhere}
  .cc-exrow code{font-family:'Courier New',monospace;background:var(--inp);padding:0 4px;border-radius:3px;color:var(--cc)}
  .cc-ex-lbl{color:var(--dm);font-style:italic}
  /* Commands user layer — favorites, folders, duplicates */
  .cc-scopes{margin-bottom:5px;padding-bottom:5px;border-bottom:1px solid var(--bl)}
  .cc-chip-add{border-style:dashed;color:var(--dm)}
  .cc-chip-add:hover{color:var(--cc);border-color:var(--cc)}
  .cc-star{background:none;border:0;cursor:pointer;color:var(--dm);font-size:13px;line-height:1;padding:1px 2px;flex-shrink:0;align-self:flex-start;opacity:.55;transition:opacity .1s,color .1s}
  .cc-star:hover{opacity:1;color:var(--cc)}
  .cc-star.on{color:var(--cc);opacity:1}
  .cc-inf{font-size:8px;color:var(--cc);background:var(--ccd);padding:1px 6px;border-radius:3px}
  .cc-mine{font-size:7.5px;color:var(--cc);background:var(--ccd);padding:1px 5px;border-radius:3px;text-transform:uppercase;letter-spacing:.3px;font-weight:700}
</style>
</head>
