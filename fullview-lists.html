<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lists & Tasks — Prompt Vault</title>
  <style>
    :root{color-scheme:dark;--bg:#111217;--panel:#191b22;--panel2:#20232c;--line:#343844;--text:#ececf1;--muted:#9da3b1;--accent:#74b9a7;--danger:#df6b72;--shadow:0 10px 30px #0007}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{border:1px solid var(--line);border-radius:7px;background:var(--panel2);color:var(--text);padding:6px 9px;cursor:pointer}button:hover{border-color:var(--accent)}button.danger{color:var(--danger)}input,select,textarea{border:1px solid var(--line);border-radius:7px;background:#12141a;color:var(--text);padding:7px;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}
    body{display:flex;flex-direction:column;overflow:hidden}.top{height:52px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}.brand{font-weight:750;font-size:15px;margin-right:auto}.brand small{display:block;color:var(--muted);font-weight:400;font-size:10px}.layout{display:grid;grid-template-columns:230px 270px minmax(0,1fr);min-height:0;flex:1}.pane{min-height:0;border-right:1px solid var(--line);display:flex;flex-direction:column}.pane-head{padding:10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}.pane-head strong{margin-right:auto}.scroll{overflow:auto;min-height:0;flex:1;padding:8px}.folder{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:6px;cursor:pointer}.folder:hover{background:var(--panel2)}.folder.on{background:#29443e;color:#c9fff0}.folder .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.count{color:var(--muted);font-size:10px}.file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:var(--panel)}.file.on{border-color:var(--accent);box-shadow:0 0 0 1px #74b9a744}.file-main{cursor:pointer;min-width:0}.file-title{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-type{color:var(--muted);font-size:10px;text-transform:capitalize}.mini{padding:3px 6px;font-size:10px}.empty{border:1px dashed var(--line);border-radius:9px;padding:22px;text-align:center;color:var(--muted);margin:8px}.editor{min-width:0;display:flex;flex-direction:column;min-height:0}.editor-head{display:flex;gap:7px;padding:10px;border-bottom:1px solid var(--line);align-items:center}.editor-title{font-weight:700;font-size:16px;min-width:100px;flex:1}.editor-body{min-height:0;overflow:auto;padding:14px}.add-row{display:flex;gap:6px;margin-bottom:10px}.add-row input{flex:1}.list-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:6px;padding:6px;border-bottom:1px solid #292c35}.list-row input[type=text]{width:100%;background:transparent}.num{color:var(--muted);text-align:right}.row-actions{display:flex;gap:3px}.sticky-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.sticky{min-height:150px;padding:10px;border-radius:5px;color:#2b271b;box-shadow:var(--shadow);display:flex;flex-direction:column}.sticky textarea{flex:1;resize:vertical;background:#ffffff38;color:#201e17;border-color:#0002}.sticky-actions{display:flex;gap:4px;margin-top:7px}.sticky-actions button,.sticky-actions select{background:#ffffff44;color:#272318;border-color:#0002}.board{display:flex;gap:12px;min-height:calc(100vh - 145px);overflow-x:auto;align-items:stretch;padding-bottom:8px}.column{width:290px;min-width:290px;max-height:calc(100vh - 165px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:9px}.column-head{padding:8px;display:flex;gap:5px;border-bottom:1px solid var(--line)}.column-head input{min-width:0;flex:1;font-weight:700}.cards{padding:8px;overflow-y:auto;min-height:100px;flex:1}.cards.over{background:#74b9a716}.card{background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px;margin-bottom:7px;cursor:grab}.card.dragging{opacity:.35}.card input{width:100%;background:transparent;margin-bottom:5px}.card-actions{display:flex;justify-content:flex-end}.column-add{display:flex;gap:5px;padding:8px;border-top:1px solid var(--line)}.column-add input{min-width:0;flex:1}.toast{position:fixed;right:14px;bottom:14px;background:#29312f;border:1px solid var(--accent);padding:8px 12px;border-radius:8px;opacity:0;pointer-events:none;transition:.2s}.toast.on{opacity:1}@media(max-width:850px){.layout{grid-template-columns:185px minmax(0,1fr)}.editor{position:fixed;inset:52px 0 0 0;background:var(--bg);z-index:3}.editor.hidden{display:none}}@media(max-width:520px){.layout{grid-template-columns:1fr}.pane:first-child{display:none}.top .wide-only{display:none}}
  </style>
</head>
<body>
  <header class="top"><button id="backBtn" title="Return to Prompt Vault">← Back / Exit</button><div class="brand">Lists & Tasks<small>Independent trees, lists, boards, and sticky notes</small></div><span id="saveState" class="count">Saved locally</span><button id="closeBtn" class="wide-only" title="Close this tab">Close</button></header>
  <main class="layout">
    <aside class="pane"><div class="pane-head"><strong>Folders</strong><button id="newFolder" class="mini">+ Folder</button></div><div class="scroll" id="folderTree"></div></aside>
    <section class="pane"><div class="pane-head"><strong id="folderTitle">Files</strong><select id="newType"><option value="bulleted">Bulleted list</option><option value="numbered">Numbered list</option><option value="checklist">Checklist</option><option value="kanban">Kanban board</option><option value="sticky">Sticky notes</option></select><button id="newFile" class="mini">+ New</button></div><div class="scroll" id="fileList"></div></section>
    <section class="editor hidden" id="editor"><div class="empty">Choose a file or create one.</div></section>
  </main>
  <div class="toast" id="toast"></div>
  <script src="lists-model.js"></script>
  <script src="fullview-lists.js"></script>
</body>
</html>
