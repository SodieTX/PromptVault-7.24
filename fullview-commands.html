<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Prompt Vault — Claude Commands</title>
<style>
  /* System font stack — no external requests. Dark palette matches the other full-view pages. */
  :root{--bg:#18181c;--sf:#1f1f25;--hv:#272730;--act:#2e2e3a;--inp:#1a1a20;--bd:#2c2c38;--bl:#252530;--tx:#e4e2dc;--mu:#8a8790;--dm:#55535e;--cc:#d97757;--ccd:rgba(217,119,87,.14);--ccb:rgba(217,119,87,.3);--gn:#5ca46c}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;color:var(--tx);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:4px}
  code{font-family:'SF Mono','Courier New',monospace}

  .top{padding:12px 22px;border-bottom:1px solid var(--bl);display:flex;align-items:center;gap:12px;flex-shrink:0;background:color-mix(in srgb,var(--sf) 60%,var(--bg))}
  .top .logo{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,var(--cc),#a8482e);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
  .top h1{font-size:16px;font-weight:700;color:var(--cc);white-space:nowrap}
  .top .meta{font-size:11px;color:var(--dm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top .srch{background:var(--inp);border:1px solid var(--bl);border-radius:7px;padding:7px 12px;color:var(--tx);font-size:13px;outline:none;width:300px;margin-left:auto;flex-shrink:0}
  .top .srch:focus{border-color:var(--cc)}

  .wrap{flex:1;display:flex;overflow:hidden}
  .nav{width:238px;min-width:200px;border-right:1px solid var(--bl);overflow-y:auto;padding:12px 8px;flex-shrink:0}
  .nav-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--dm);font-weight:700;padding:4px 10px;margin-bottom:4px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;border-radius:7px;font-size:12.5px;color:var(--mu);user-select:none;margin:1px 0;transition:background .1s,color .1s}
  .nav-item:hover{background:var(--hv);color:var(--tx)}
  .nav-item.sel{background:var(--ccd);color:var(--cc);font-weight:600}
  .nav-item .ico{width:18px;text-align:center;flex-shrink:0}
  .nav-item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .ct{font-size:10px;color:var(--dm);background:var(--hv);padding:0 6px;border-radius:8px;line-height:16px}
  .nav-item.sel .ct{background:var(--ccb);color:var(--cc)}

  .content{flex:1;overflow-y:auto;padding:16px 24px 60px}
  .hint{font-size:11px;color:var(--dm);margin-bottom:14px;line-height:1.5}
  .hint code{background:var(--inp);padding:1px 5px;border-radius:3px;color:var(--cc)}
  .section{margin-bottom:26px}
  .sec-hd{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--tx);padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--bl)}
  .sec-hd .ico{font-size:16px}
  .sec-hd .ct{font-size:10px;font-weight:600;color:var(--dm);background:var(--hv);padding:1px 8px;border-radius:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
  .card{background:var(--sf);border:1px solid var(--bl);border-radius:9px;padding:12px 13px;cursor:pointer;transition:border-color .1s,background .1s;display:flex;flex-direction:column;gap:7px}
  .card:hover{border-color:var(--ccb);background:var(--hv)}
  .card-hd{display:flex;align-items:center;gap:8px}
  .card .cmd{font-size:13px;font-weight:600;background:var(--inp);color:var(--cc);padding:2px 8px;border-radius:5px;overflow-wrap:anywhere}
  .card .copy{margin-left:auto;font-size:10px;font-weight:600;color:var(--mu);background:transparent;border:1px solid var(--bl);border-radius:6px;padding:3px 9px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .1s}
  .card:hover .copy{border-color:var(--cc);color:var(--cc)}
  .card .desc{font-size:12px;color:var(--mu);line-height:1.5}
  .card .ex{font-size:11px;color:var(--dm);line-height:1.5;overflow-wrap:anywhere}
  .card .ex b{color:var(--dm);font-style:italic;font-weight:400;margin-right:3px}
  .card .ex code{background:var(--inp);color:var(--cc);padding:1px 5px;border-radius:3px}
  .card .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:1px}
  .card .tag{font-size:9.5px;color:var(--dm);background:var(--inp);padding:1px 7px;border-radius:4px}
  .empty{font-size:13px;color:var(--dm);text-align:center;padding:60px 20px}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--act);color:var(--tx);border:1px solid var(--ccb);border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:100}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="top">
  <div class="logo">⌨️</div>
  <h1>Claude Commands</h1>
  <span class="meta" id="meta"></span>
  <input class="srch" id="srch" type="text" placeholder="Search name, description, tag…" autocomplete="off">
</div>
<div class="wrap">
  <aside class="nav" id="nav"></aside>
  <main class="content" id="content"></main>
</div>
<div class="toast" id="toast"></div>
<script src="claude-commands-data.js"></script>
<script src="fullview-commands.js"></script>
</body>
</html>
